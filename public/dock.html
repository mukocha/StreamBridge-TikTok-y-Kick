<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Dock - Chat & Alertas Unificadas</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0e12;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 6px;
    }

    /* Top Bar */
    .dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #11141e;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 5px 8px;
      margin-bottom: 6px;
      flex-shrink: 0;
      height: 38px;
    }

    /* Viewers pill */
    .viewers-box {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      height: 26px;
    }
    .v-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
    }
    .v-item.kick { color: #53fc18; }
    .v-item.tiktok { color: #fe2c55; }
    .v-item.total {
      color: #fff;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 6px;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulseLive 1.5s infinite;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* Unified Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tb-btn {
      height: 26px;
      padding: 0 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: all 0.15s ease;
      user-select: none;
    }

    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.18);
    }
    .tb-btn:active {
      transform: scale(0.96);
    }

    /* Sound button states */
    .tb-btn.sound-on {
      color: #34d399;
      border-color: rgba(52, 211, 153, 0.35);
      background: rgba(16, 185, 129, 0.1);
    }
    .tb-btn.sound-muted {
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Mode button states */
    .tb-btn.mode-normal {
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.35);
      background: rgba(59, 130, 246, 0.08);
    }
    .tb-btn.mode-slow {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.12);
    }

    /* Live Stream Feed (Minimalista) */
    #stream-feed {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 4px;
    }

    /* Scrollbar ultra delgada */
    #stream-feed::-webkit-scrollbar { width: 4px; }
    #stream-feed::-webkit-scrollbar-thumb { background: #262a3b; border-radius: 2px; }

    /* Mensajes de Chat Minimalistas */
    .chat-line {
      flex-shrink: 0 !important;
      padding: 4px 6px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .chat-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .chat-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: inline-block;
      vertical-align: middle;
    }
    .chat-badge.kick { background: #53fc18; color: #000; }
    .chat-badge.tiktok { background: #fe2c55; color: #fff; }

    .chat-user {
      font-weight: 700;
      margin-right: 5px;
    }
    .chat-user.kick { color: #53fc18; }
    .chat-user.tiktok { color: #00f2fe; }

    .chat-text {
      color: #e2e8f0;
    }

    .chat-emote {
      height: 22px;
      vertical-align: middle;
      margin: 0 2px;
      object-fit: contain;
      display: inline-block;
    }

    /* Alertas dentro del Chat (Ultra llamativas, NUNCA comprimidas) */
    .alert-line {
      display: block !important;
      padding: 8px 10px !important;
      margin: 6px 0 !important;
      border-radius: 6px !important;
      font-size: 13px !important;
      line-height: 1.45 !important;
      position: relative !important;
      flex-shrink: 0 !important;
      min-height: 52px !important;
      max-height: none !important;
      box-sizing: border-box !important;
      overflow: visible !important;
      animation: alertPop 0.3s ease;
    }

    .alert-line::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
    }

    .alert-line.kick {
      background: linear-gradient(135deg, rgba(83, 252, 24, 0.22) 0%, rgba(13, 19, 33, 0.98) 100%) !important;
      border: 1px solid rgba(83, 252, 24, 0.6) !important;
      box-shadow: 0 2px 12px rgba(83, 252, 24, 0.25) !important;
    }
    .alert-line.kick::before {
      background: #53fc18;
      box-shadow: 0 0 10px #53fc18;
    }

    .alert-line.tiktok {
      background: linear-gradient(135deg, rgba(254, 44, 85, 0.24) 0%, rgba(13, 19, 33, 0.98) 100%) !important;
      border: 1px solid rgba(254, 44, 85, 0.6) !important;
      box-shadow: 0 2px 12px rgba(254, 44, 85, 0.25) !important;
    }
    .alert-line.tiktok::before {
      background: #fe2c55;
      box-shadow: 0 0 10px #fe2c55;
    }

    .alert-header {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 6px !important;
      margin-bottom: 5px !important;
      width: 100% !important;
    }

    .alert-badge {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .alert-line.kick .alert-badge {
      background: rgba(83, 252, 24, 0.3);
      color: #53fc18;
      border: 1px solid rgba(83, 252, 24, 0.6);
    }
    .alert-line.tiktok .alert-badge {
      background: rgba(254, 44, 85, 0.3);
      color: #ff5476;
      border: 1px solid rgba(254, 44, 85, 0.6);
    }

    .alert-body {
      display: block !important;
      width: 100% !important;
      font-size: 13px !important;
      line-height: 1.4 !important;
      color: #f1f5f9 !important;
      word-break: break-word !important;
      white-space: normal !important;
      padding-left: 2px !important;
    }

    .alert-user-name {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
      margin-right: 6px;
    }

    .alert-details-text {
      font-size: 12px;
      color: #f1f5f9;
      font-weight: 500;
    }

    .alert-time {
      font-size: 10px;
      color: #94a3b8;
      margin-left: auto;
      flex-shrink: 0;
    }

    @keyframes alertPop {
      0% { opacity: 0; transform: translateY(-4px); }
      100% { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Header: Contador de Viewers + Acciones -->
  <div class="dock-header">
    <div class="viewers-box">
      <div class="v-item kick" title="Espectadores Kick">🟢 <span id="dock-kick-v">0</span></div>
      <div class="v-item tiktok" title="Espectadores TikTok">🎵 <span id="dock-tiktok-v">0</span></div>
      <div class="v-item total" title="Total Espectadores"><span class="dot-live"></span> <span id="dock-total-v">0</span></div>
    </div>

    <div class="toolbar">
      <button class="tb-btn sound-on" id="btn-dock-sound" onclick="toggleDockSound()" title="Sonido activado en OBS (Clic para silenciar o probar)">
        <span id="sound-icon">🔊</span>
      </button>
      <button class="tb-btn mode-normal" id="btn-slow-mode" onclick="toggleSlowMode()" title="Alternar entre modo normal y modo lento">
        <span id="mode-icon">⚡</span> <span id="mode-text">Normal</span>
      </button>
      <button class="tb-btn" onclick="clearFeed()" title="Limpiar feed">Limpiar</button>
    </div>
  </div>

  <!-- Feed unificado de Chat y Alertas -->
  <div id="stream-feed"></div>

  <script>
    const socket = io();

    const feed = document.getElementById('stream-feed');
    const dockKickV = document.getElementById('dock-kick-v');
    const dockTikTokV = document.getElementById('dock-tiktok-v');
    const dockTotalV = document.getElementById('dock-total-v');

    let isAutoScroll = true;
    let slowMode = false;
    let slowQueue = [];
    let slowTimer = null;

    // Control de Audio en el Dock de OBS
    let soundEnabled = true;
    let alertVolume = 0.8;
    let customSoundUrl = '';
    let audioCtx = null;
    let currentDockAudio = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function unlockAudio() {
      getAudioContext();
    }
    window.addEventListener('click', unlockAudio, { passive: true });
    window.addEventListener('keydown', unlockAudio, { passive: true });

    function toggleDockSound() {
      soundEnabled = !soundEnabled;
      updateDockSoundButton();
      if (soundEnabled) {
        playDockAlertSound(true);
      }
    }

    function updateDockSoundButton() {
      const btn = document.getElementById('btn-dock-sound');
      const icon = document.getElementById('sound-icon');
      if (!btn) return;
      if (soundEnabled) {
        btn.className = 'tb-btn sound-on';
        if (icon) icon.textContent = '🔊';
        btn.title = 'Sonido de alertas ACTIVADO en OBS. Clic para silenciar';
      } else {
        btn.className = 'tb-btn sound-muted';
        if (icon) icon.textContent = '🔇';
        btn.title = 'Sonido de alertas SILENCIADO en OBS. Clic para activar y probar';
      }
    }

    function playDockAlertSound(isTest = false) {
      if (!soundEnabled && !isTest) return;
      const vol = Math.max(0, Math.min(1, alertVolume !== undefined ? alertVolume : 0.8));
      const soundSrc = customSoundUrl || '/sounds/alert.wav';

      try {
        if (currentDockAudio) {
          try { currentDockAudio.pause(); currentDockAudio.currentTime = 0; } catch (_) {}
        }
        currentDockAudio = new Audio(soundSrc);
        currentDockAudio.volume = vol;
        currentDockAudio.play().catch(e => {
          console.warn('HTML5 Audio en Dock falló, usando Web Audio sintetizado:', e);
          playDockSynthesizedChime(vol);
        });
      } catch (_) {
        playDockSynthesizedChime(vol);
      }
    }

    function playDockSynthesizedChime(vol = 0.8) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const playNotes = () => {
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(659.25, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.24);
          osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.36);

          gain.gain.setValueAtTime(vol * 0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.9);
        };

        if (ctx.state === 'suspended') {
          ctx.resume().then(playNotes).catch(() => {});
        } else {
          playNotes();
        }
      } catch (_) {}
    }

    function setSlowMode(enabled) {
      slowMode = Boolean(enabled);
      const btn = document.getElementById('btn-slow-mode');
      const icon = document.getElementById('mode-icon');
      const text = document.getElementById('mode-text');
      if (btn) {
        btn.className = slowMode ? 'tb-btn mode-slow' : 'tb-btn mode-normal';
        if (icon) icon.textContent = slowMode ? '⏳' : '⚡';
        if (text) text.textContent = slowMode ? '1.5s' : 'Normal';
        btn.title = slowMode ? 'Modo lento activo (1 msj / 1.5s). Clic para modo normal' : 'Modo normal activo. Clic para modo lento';
      }
      if (slowMode && !slowTimer) {
        slowTimer = setInterval(() => {
          if (slowQueue.length > 0) {
            renderChatMessage(slowQueue.shift());
          }
        }, 1500);
      } else if (!slowMode && slowTimer) {
        clearInterval(slowTimer);
        slowTimer = null;
        while (slowQueue.length > 0) {
          renderChatMessage(slowQueue.shift());
        }
      }
    }

    function toggleSlowMode() {
      const next = !slowMode;
      setSlowMode(next);
      socket.emit('settings:update', { slowMode: next });
    }

    feed.addEventListener('scroll', () => {
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
      isAutoScroll = nearBottom;
    });

    function scrollToBottom() {
      if (isAutoScroll) {
        feed.scrollTop = feed.scrollHeight;
      }
    }

    function clearFeed() {
      feed.innerHTML = '';
    }

    function updateDockViewers(v) {
      if (!v) return;
      if (dockKickV) dockKickV.textContent = (v.kick || 0).toLocaleString();
      if (dockTikTokV) dockTikTokV.textContent = (v.tiktok || 0).toLocaleString();
      if (dockTotalV) dockTotalV.textContent = (v.total || 0).toLocaleString();
    }

    function updateDockStatus(platform, status) {
      const dot = document.getElementById(`${platform}-dot`);
      if (!dot) return;
      dot.className = `dot ${status}`;
    }

    function formatChatMessage(text) {
      if (!text) return '';
      let safe = escapeHtml(text);
      return safe.replace(/\[emote:(\d+):([^\]]+)\]/g, (match, id, name) => {
        return `<img class="chat-emote" src="https://files.kick.com/emotes/${id}/fullsize" alt="${name}" title="${name}" loading="lazy">`;
      });
    }

    function addChatMessage(msg) {
      if (slowMode) {
        slowQueue.push(msg);
        if (slowQueue.length > 50) slowQueue.shift(); // Evitar desbordamiento
      } else {
        renderChatMessage(msg);
      }
    }

    function renderChatMessage(msg) {
      const div = document.createElement('div');
      div.className = 'chat-line';

      const isKick = msg.platform === 'kick';
      const userClass = isKick ? 'kick' : 'tiktok';

      div.innerHTML = `
        <strong class="chat-user ${userClass}">${escapeHtml(msg.user || msg.nickname)}:</strong>
        <span class="chat-text">${formatChatMessage(msg.message)}</span>
      `;

      feed.appendChild(div);
      trimFeed();
      scrollToBottom();
    }

    // 2. Alerta Integrada directamente en el Chat (Diseño llamativo de alto impacto)
    function addAlertMessage(alert) {
      if (!alert || alert.type === 'member') return; // Omitir aviso de entrada

      const div = document.createElement('div');
      div.className = `alert-line ${alert.platform}`;

      let badgeTitle = 'ALERTA';
      let icon = '🎉';

      if (alert.type === 'gift') {
        badgeTitle = alert.platform === 'tiktok' ? '🎁 REGALO TIKTOK' : '🎁 REGALO';
        icon = '🎁';
      } else if (alert.type === 'gift_sub') {
        badgeTitle = '🎁 SUBS REGALADAS';
        icon = '🎁';
      } else if (alert.type === 'sub') {
        badgeTitle = '⭐ NUEVA SUSCRIPCIÓN';
        icon = '⭐';
      } else if (alert.type === 'resub') {
        badgeTitle = '🔄 RENOVACIÓN SUB';
        icon = '🔄';
      } else if (alert.type === 'kicks') {
        badgeTitle = '🪙 REGALO KICKS';
        icon = '🪙';
      } else if (alert.type === 'host') {
        badgeTitle = '📡 HOST / RAID';
        icon = '📡';
      } else if (alert.type === 'follow') {
        badgeTitle = '💖 NUEVO SEGUIDOR';
        icon = '💖';
      } else if (alert.type === 'like') {
        badgeTitle = '❤️ LIKES';
        icon = '❤️';
      } else if (alert.type === 'share') {
        badgeTitle = '🚀 COMPARTIDO';
        icon = '🚀';
      }

      const timeStr = new Date(alert.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <div class="alert-header">
          <span class="alert-badge">${badgeTitle}</span>
          <span class="alert-time">${timeStr}</span>
        </div>
        <div class="alert-body">
          <strong class="alert-user-name">${escapeHtml(alert.user)}:</strong>
          <span class="alert-details-text">${escapeHtml(alert.details || '')}</span>
        </div>
      `;

      feed.appendChild(div);
      trimFeed();
      scrollToBottom();
    }

    function trimFeed() {
      while (feed.children.length > 80) {
        feed.removeChild(feed.children[0]);
      }
    }

    // Socket Events
    socket.on('init', ({ state, recentMessages, alertHistory }) => {
      updateDockStatus('kick', state.kick.status);
      updateDockStatus('tiktok', state.tiktok.status);
      if (state.viewers) updateDockViewers(state.viewers);
      if (state.settings) {
        if (state.settings.slowMode !== undefined) setSlowMode(state.settings.slowMode);
        if (state.settings.soundEnabled !== undefined) soundEnabled = state.settings.soundEnabled;
        if (state.settings.alertVolume !== undefined) alertVolume = state.settings.alertVolume;
        if (state.settings.customSoundUrl !== undefined) customSoundUrl = state.settings.customSoundUrl;
        updateDockSoundButton();
      }

      // Combinar y ordenar mensajes y alertas por fecha para mostrar historial cronológico
      const combined = [];
      if (Array.isArray(recentMessages)) {
        recentMessages.forEach(m => combined.push({ kind: 'chat', data: m, time: m.timestamp || 0 }));
      }
      if (Array.isArray(alertHistory)) {
        alertHistory.forEach(a => {
          if (a.type !== 'member') combined.push({ kind: 'alert', data: a, time: a.timestamp || 0 });
        });
      }

      combined.sort((a, b) => a.time - b.time);
      combined.forEach(item => {
        if (item.kind === 'chat') addChatMessage(item.data);
        else addAlertMessage(item.data);
      });
    });

    socket.on('status:update', (data) => {
      updateDockStatus(data.platform, data.status);
    });

    socket.on('viewers:update', (v) => {
      updateDockViewers(v);
    });

    socket.on('settings:update', (settings) => {
      if (!settings) return;
      if (settings.slowMode !== undefined) setSlowMode(settings.slowMode);
      if (settings.soundEnabled !== undefined) soundEnabled = settings.soundEnabled;
      if (settings.alertVolume !== undefined) alertVolume = settings.alertVolume;
      if (settings.customSoundUrl !== undefined) customSoundUrl = settings.customSoundUrl;
      updateDockSoundButton();
    });

    socket.on('chat:message', (msg) => {
      addChatMessage(msg);
    });

    socket.on('alert:event', (alert) => {
      if (alert.type === 'member') return; // Omitir avisos de entrada
      addAlertMessage(alert);
      if (alert.sound !== false) {
        playDockAlertSound();
      }
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
