<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>OBS Dock - Chat & Alertas Unificadas</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0e12;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 6px;
    }

    /* Top Bar */
    .dock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #14161f;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.connected { background: #10b981; box-shadow: 0 0 6px #10b981; }
    .dot.disconnected { background: #ef4444; }
    .dot.connecting { background: #f59e0b; }

    /* Viewers box */
    .viewers-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .v-item {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 700;
    }
    .v-item.kick { color: #53fc18; }
    .v-item.tiktok { color: #fe2c55; }
    .v-item.total {
      color: #fff;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      padding-left: 6px;
    }

    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      animation: pulseLive 1.5s infinite;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mode {
      background: #18223a;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-mode.normal {
      border-color: #3b82f6;
      color: #60a5fa;
    }
    .btn-mode.slow {
      background: rgba(245, 158, 11, 0.15);
      border-color: #f59e0b;
      color: #fbbf24;
    }

    .btn-clear {
      background: #1e2230;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-clear:hover {
      background: #2a3045;
      color: #fff;
    }

    /* Live Stream Feed (Minimalista) */
    #stream-feed {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-right: 4px;
    }

    /* Scrollbar ultra delgada */
    #stream-feed::-webkit-scrollbar { width: 4px; }
    #stream-feed::-webkit-scrollbar-thumb { background: #262a3b; border-radius: 2px; }

    /* Mensajes de Chat Minimalistas */
    .chat-line {
      padding: 4px 6px;
      font-size: 13px;
      line-height: 1.4;
      word-break: break-word;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .chat-line:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .chat-badge {
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 5px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      display: inline-block;
      vertical-align: middle;
    }
    .chat-badge.kick { background: #53fc18; color: #000; }
    .chat-badge.tiktok { background: #fe2c55; color: #fff; }

    .chat-user {
      font-weight: 700;
      margin-right: 5px;
    }
    .chat-user.kick { color: #53fc18; }
    .chat-user.tiktok { color: #00f2fe; }

    .chat-text {
      color: #e2e8f0;
    }

    .chat-emote {
      height: 22px;
      vertical-align: middle;
      margin: 0 2px;
      object-fit: contain;
      display: inline-block;
    }

    /* Alertas dentro del Chat (Destacadas pero compactas) */
    .alert-line {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      margin: 3px 0;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.35;
      animation: alertSlide 0.25s ease;
    }

    .alert-line.kick {
      background: rgba(83, 252, 24, 0.12);
      border-left: 3px solid #53fc18;
      color: #d9f99d;
    }

    .alert-line.tiktok {
      background: rgba(254, 44, 85, 0.12);
      border-left: 3px solid #fe2c55;
      color: #fecdd3;
    }

    .alert-icon {
      font-size: 14px;
      flex-shrink: 0;
    }

    .alert-content {
      flex: 1;
    }

    .alert-user {
      font-weight: 800;
      color: #fff;
    }

    .alert-time {
      font-size: 10px;
      color: #64748b;
      margin-left: auto;
      flex-shrink: 0;
    }

    @keyframes alertSlide {
      from { opacity: 0; transform: translateX(-6px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <!-- Header: Estado + Contador de Viewers -->
  <div class="dock-header">
    <div class="status-group">
      <span><span class="dot disconnected" id="kick-dot"></span> Kick</span>
      <span><span class="dot disconnected" id="tiktok-dot"></span> TikTok</span>
    </div>

    <div class="viewers-box">
      <div class="v-item kick">🟢 <span id="dock-kick-v">0</span></div>
      <div class="v-item tiktok">🎵 <span id="dock-tiktok-v">0</span></div>
      <div class="v-item total"><span class="dot-live"></span> <span id="dock-total-v">0</span></div>
    </div>

    <div class="actions-group">
      <button class="btn-mode normal" id="btn-slow-mode" onclick="toggleSlowMode()" title="Alternar entre modo normal y modo lento para chats rápidos">⚡ Normal</button>
      <button class="btn-clear" onclick="clearFeed()">Limpiar</button>
    </div>
  </div>

  <!-- Feed unificado de Chat y Alertas -->
  <div id="stream-feed"></div>

  <script>
    const socket = io();

    const feed = document.getElementById('stream-feed');
    const dockKickV = document.getElementById('dock-kick-v');
    const dockTikTokV = document.getElementById('dock-tiktok-v');
    const dockTotalV = document.getElementById('dock-total-v');

    let isAutoScroll = true;
    let slowMode = false;
    let slowQueue = [];
    let slowTimer = null;

    function setSlowMode(enabled) {
      slowMode = Boolean(enabled);
      const btn = document.getElementById('btn-slow-mode');
      if (btn) {
        btn.textContent = slowMode ? '⏳ Lento (1.5s)' : '⚡ Normal';
        btn.className = slowMode ? 'btn-mode slow' : 'btn-mode normal';
      }
      if (slowMode && !slowTimer) {
        slowTimer = setInterval(() => {
          if (slowQueue.length > 0) {
            renderChatMessage(slowQueue.shift());
          }
        }, 1500);
      } else if (!slowMode && slowTimer) {
        clearInterval(slowTimer);
        slowTimer = null;
        while (slowQueue.length > 0) {
          renderChatMessage(slowQueue.shift());
        }
      }
    }

    function toggleSlowMode() {
      const next = !slowMode;
      setSlowMode(next);
      socket.emit('settings:update', { slowMode: next });
    }

    feed.addEventListener('scroll', () => {
      const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
      isAutoScroll = nearBottom;
    });

    function scrollToBottom() {
      if (isAutoScroll) {
        feed.scrollTop = feed.scrollHeight;
      }
    }

    function clearFeed() {
      feed.innerHTML = '';
    }

    function updateDockViewers(v) {
      if (!v) return;
      if (dockKickV) dockKickV.textContent = (v.kick || 0).toLocaleString();
      if (dockTikTokV) dockTikTokV.textContent = (v.tiktok || 0).toLocaleString();
      if (dockTotalV) dockTotalV.textContent = (v.total || 0).toLocaleString();
    }

    function updateDockStatus(platform, status) {
      const dot = document.getElementById(`${platform}-dot`);
      if (!dot) return;
      dot.className = `dot ${status}`;
    }

    function formatChatMessage(text) {
      if (!text) return '';
      let safe = escapeHtml(text);
      return safe.replace(/\[emote:(\d+):([^\]]+)\]/g, (match, id, name) => {
        return `<img class="chat-emote" src="https://files.kick.com/emotes/${id}/fullsize" alt="${name}" title="${name}" loading="lazy">`;
      });
    }

    function addChatMessage(msg) {
      if (slowMode) {
        slowQueue.push(msg);
        if (slowQueue.length > 50) slowQueue.shift(); // Evitar desbordamiento
      } else {
        renderChatMessage(msg);
      }
    }

    function renderChatMessage(msg) {
      const div = document.createElement('div');
      div.className = 'chat-line';

      const isKick = msg.platform === 'kick';
      const badgeText = isKick ? 'KICK' : 'TIKTOK';
      const userClass = isKick ? 'kick' : 'tiktok';

      div.innerHTML = `
        <span class="chat-badge ${msg.platform}">${badgeText}</span>
        <strong class="chat-user ${userClass}">${escapeHtml(msg.user || msg.nickname)}:</strong>
        <span class="chat-text">${formatChatMessage(msg.message)}</span>
      `;

      feed.appendChild(div);
      trimFeed();
      scrollToBottom();
    }

    // 2. Alerta Integrada directamente en el Chat
    function addAlertMessage(alert) {
      const div = document.createElement('div');
      div.className = `alert-line ${alert.platform}`;

      let icon = '🎉';
      if (alert.type === 'gift' || alert.type === 'gift_sub') icon = '🎁';
      else if (alert.type === 'sub') icon = '⭐';
      else if (alert.type === 'resub') icon = '🔄';
      else if (alert.type === 'kicks') icon = '🪙';
      else if (alert.type === 'host') icon = '📡';
      else if (alert.type === 'follow') icon = '💖';
      else if (alert.type === 'like') icon = '❤️';
      else if (alert.type === 'share') icon = '🚀';
      else if (alert.type === 'member') icon = '👋';

      const timeStr = new Date(alert.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      div.innerHTML = `
        <span class="alert-icon">${icon}</span>
        <div class="alert-content">
          <span class="alert-user">${escapeHtml(alert.user)}</span>
          <span>${escapeHtml(alert.details || '')}</span>
        </div>
        <span class="alert-time">${timeStr}</span>
      `;

      feed.appendChild(div);
      trimFeed();
      scrollToBottom();
    }

    function trimFeed() {
      while (feed.children.length > 80) {
        feed.removeChild(feed.children[0]);
      }
    }

    // Socket Events
    socket.on('init', ({ state, recentMessages, alertHistory }) => {
      updateDockStatus('kick', state.kick.status);
      updateDockStatus('tiktok', state.tiktok.status);
      if (state.viewers) updateDockViewers(state.viewers);
      if (state.settings && state.settings.slowMode !== undefined) {
        setSlowMode(state.settings.slowMode);
      }

      // Combinar y ordenar mensajes y alertas por fecha para mostrar historial cronológico
      const combined = [];
      if (Array.isArray(recentMessages)) {
        recentMessages.forEach(m => combined.push({ kind: 'chat', data: m, time: m.timestamp || 0 }));
      }
      if (Array.isArray(alertHistory)) {
        alertHistory.forEach(a => combined.push({ kind: 'alert', data: a, time: a.timestamp || 0 }));
      }

      combined.sort((a, b) => a.time - b.time);
      combined.forEach(item => {
        if (item.kind === 'chat') addChatMessage(item.data);
        else addAlertMessage(item.data);
      });
    });

    socket.on('status:update', (data) => {
      updateDockStatus(data.platform, data.status);
    });

    socket.on('viewers:update', (v) => {
      updateDockViewers(v);
    });

    socket.on('settings:update', (settings) => {
      if (settings && settings.slowMode !== undefined) {
        setSlowMode(settings.slowMode);
      }
    });

    socket.on('chat:message', (msg) => {
      addChatMessage(msg);
    });

    socket.on('alert:event', (alert) => {
      addAlertMessage(alert);
    });

    function escapeHtml(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
